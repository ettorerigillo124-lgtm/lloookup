# Configurazione demo LookUp. Tutte le soglie sono qui.

source: 0               # sovrascrivibile da riga di comando con --source
device: auto            # auto | cuda | mps | cpu

models:
  world: models/yolov8s-worldv2.pt      # detection open-vocabulary (YOLO-World)
  person_seg: models/yolov8n-seg.pt     # segmentazione persona
  hands: models/hand_landmarker.task    # MediaPipe Tasks
  face: models/blaze_face_short_range.tflite  # solo per tenere sempre oscurato il volto (nessun riconoscimento)

# Classi target. Ogni classe ha piu' prompt (sinonimi): vince il prompt con confidence piu' alta.
# "bag: true" = classe contenitore (sacchetto), non viene tracciata come merce.
classes:
  - name: notebook
    prompts: [notebook, book]
    conf: 0.35
  - name: eyeglasses
    prompts: [eyeglasses, glasses]
    conf: 0.35
  - name: pen
    prompts: [pen, ballpoint pen]
    conf: 0.10
  - name: bag
    prompts: [paper bag, shopping bag, plastic bag, tote bag]
    conf: 0.30
    bag: true

detection:
  imgsz: 640              # risoluzione di inferenza YOLO-World
  detect_every: 1         # 2 = detection a frame alterni (piu' FPS)
  auto_skip_below_fps: 12 # se gli FPS medi scendono sotto, passa a detect_every=2 (0 = disattivo)
  max_det: 30

person:
  imgsz: 384
  conf: 0.25
  mask_dilate_px: 25      # allarga la maschera per coprire i bordi
  hold_frames: 20         # per quanti frame dopo l'ultima persona vista si applica il fail-safe

privacy:
  method: pixelate        # pixelate | blur
  pixel_blocks: 14        # blocchi sul lato corto della bbox persona (piu' basso = piu' anonimo)
  blur_kernel: 99
  # Se nessuna persona e' segmentata ma ce n'era una negli ultimi hold_frames, o se ci sono mani
  # senza persona: tutto il frame viene oscurato.
  failsafe_full_frame: true
  # Mostra i pixel reali degli oggetti target sopra l'oscuramento (mai nella zona testa/volto).
  show_object_pixels: true
  head_zone_ratio: 0.22   # quota superiore della bbox persona considerata "testa"
  face_pad: 0.6           # margine attorno al volto rilevato (frazione della sua bbox)
  never_reveal: [eyeglasses]   # classi indossate sul volto: solo bbox, mai pixel reali
  reveal_max_frac: 0.06   # oggetti piu' grandi di questa frazione del frame: solo bbox (evita di scoprire il busto)

hands:
  num_hands: 2
  min_conf: 0.3
  use_pose_fallback: false

tracking:
  match_dist: 0.35        # distanza massima centro-centro (in diagonali della bbox) per associare
  max_age_s: 6.0          # dopo quanti secondi senza detection una traccia viene eliminata (se non armata)
  min_hits: 3             # detection minime prima che una traccia sia mostrata/usata (anti falsi positivi)
  show_occult_s: 4.0       # per quanto resta disegnata la bbox di un oggetto occultato
  show_stale_s: 1.0       # una traccia non armata e non vista da piu' di cosi' non viene disegnata
  bag_memory_s: 1.0       # il sacchetto resta "presente" per questo tempo dopo l'ultima detection

state:
  # Distanza oggetto-mano: distanza tra bbox oggetto (allargata) e punti della mano, in px a 640 di lato lungo.
  hand_dist_px: 40
  in_hand_frames: 4        # N: frame (con isteresi) vicino a una mano per passare IN_MANO
  release_frames: 15       # frame lontano dalla mano per tornare VISIBILE
  bag_dist_px: 50          # distanza oggetto/mano-sacchetto
  near_bag_frames: 3
  bag_release_frames: 20
  missing_frames: 45       # M: frame consecutivi senza detection per OCCULTATO
  armed_window_s: 12.0     # l'occultamento conta solo se l'oggetto era in mano/vicino al sacchetto da poco
  hand_to_bag: true        # oggetto sparito + la mano che lo teneva va al sacchetto => VICINO_SACCHETTO
  hand_follow_px: 60       # spostamento massimo della mano tra due frame per considerarla la stessa
  require_bag: true        # OCCULTATO solo se l'ultimo stato era VICINO_SACCHETTO (meno falsi allarmi)
  reappear_frames: 6       # se l'oggetto riappare per K frame prima di M, l'occultamento si annulla

display:
  width: 1280              # larghezza finestra (video + pannello)
  panel_width: 360
  log_lines: 14
